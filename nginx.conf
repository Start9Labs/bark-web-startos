# Serves the bark-web SPA and reverse-proxies to the node API (4001) and barkd
# WebSocket (4000). All three processes share the service's network namespace,
# so the upstreams are localhost.

server_tokens off;

server {
  listen 8080;
  server_name _;
  root /app/web;
  index index.html;

  # A location with add_header of its own drops these, so each repeats them.
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri =404;
  }

  # The Node API cannot upgrade WebSockets. The single-use ticket authenticates
  # the connection directly to barkd.
  location = /api/barkd/api/v1/notifications/ws {
    proxy_pass http://127.0.0.1:4000/api/v1/notifications/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # The API allowlists the routes it forwards (mnemonic excluded) and is the
  # primary guard; this also catches case and trailing-slash variants.
  location ~* ^/api/barkd/.*mnemonic {
    return 404;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 50m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
